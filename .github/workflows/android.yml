name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Paketleri kur
        run: npm install

      - name: Supabase istemcisini kopyala
        run: npm run vendor

      - name: Android projesini oluştur
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew assembleDebug --no-daemon && break; echo "Tekrar deneniyor ($i)"; sleep 15; done
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: APK dosyasını adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk doli-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: doli-apk
          path: doli-${{ github.run_number }}.apk

      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Doli 1.0.${{ github.run_number }}
          body: Telefona indirip kur. Bilinmeyen kaynaklardan yüklemeye izin vermen gerekebilir.
          files: doli-${{ github.run_number }}.apk
